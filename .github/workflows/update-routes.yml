name: 更新航線並發布網站

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 0 * * 1" # 每週一 08:17（台灣時間）自動更新
  workflow_dispatch: # 在 Actions 頁面可以手動按「Run workflow」

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 下載最新航線資料
        run: python scripts/build_routes.py

      - name: 有變動就存回 repo
        run: |
          if git diff --quiet -- data/routes.js; then
            echo "航線沒有變動"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/routes.js
          git commit -m "更新航線資料 $(TZ=Asia/Taipei date +%F)"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
